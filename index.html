<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oumra Prestige – Connexion</title>
  <link rel="stylesheet" href="style.CSS">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet" />
</head>

<body>
  <nav class="navbar navbar-expand-lg px-4 py-2">
    <a class="navbar-brand" href="#">
      <div class="brand-badge">OP</div>
      Oumra Prestige
    </a>

    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav mx-auto gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="/acceille.html">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="/a propos.html">À propos</a></li>
        <li class="nav-item"><a class="nav-link" href="/reservation.html">Réservation</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
      </ul>
      <div class="d-flex gap-2 mt-3 mt-lg-0">
        <a href="/index.html"><button class="btn btn-connexion">Connexion</button></a>
        <a href="/inscription.html"><button class="btn btn-inscrire">S'inscrire</button></a>
      </div>
    </div>
  </nav>

  <main class="d-flex justify-content-center align-items-center py-5 px-3" style="min-height: calc(100vh - 62px);">
    <div class="login-card">
      <div class="text-center">
        <div class="avatar-circle">
          <i class="bi bi-person-fill"></i>
        </div>
        <h2>Bon retour !</h2>
        <p class="subtitle">Connectez-vous à votre compte</p>
      </div>

      <div class="mb-3">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="votre.email@exemple.fr" />
      </div>

      <div class="mb-3">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" class="form-control" value="••••••••" />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="remember" />
          <label class="form-check-label" for="remember">Se souvenir de moi</label>
        </div>
        <a href="#" class="forgot-link">Mot de passe oublié ?</a>
      </div>

      <a href="/inscription.html"><button class="btn btn-submit mb-3">Se connecter</button></a>

      <div class="divider">OU</div>


      <div class="d-flex flex-column gap-2 mb-3">
        <a href="#" class="btn-social">
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.83z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.83c.87-2.6 3.3-4.52 6.16-4.52z"
              fill="#EA4335" />
          </svg>
          Continuer avec Google
        </a>
        <a href="#" class="btn-social">
          <i class="bi bi-facebook fb-icon"></i>
          Continuer avec Facebook
        </a>
      </div>

      <p class="text-center signup-text mb-0">
        Vous n'avez pas de compte ? <a href="/inscription.html">S'inscrire</a>
      </p>

      <p class="text-center secure-note mb-0">
        <i class="bi bi-lock-fill me-1"></i>Connexion sécurisée et cryptée
      </p>

    </div>
  </main>

</body>

</html>
